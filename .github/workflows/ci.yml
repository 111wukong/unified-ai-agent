name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # `[api]` and `[memory]` are required here, not optional: without
        # fastapi the API tests `importorskip` and silently vanish, and
        # without sqlite-vec the accelerated cosine path is never exercised.
        # CI going green while a whole layer is untested is the failure the
        # skip guard below exists to catch, but installing the extras is the
        # fix.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,memory]"
          pip install ruff

      - name: Assert the vector accelerator actually loads
        # An assertion, not a printout. If sqlite-vec silently fails to load
        # here, every cosine test falls back to the Python path and the
        # accelerated path is never exercised -- a whole code path untested
        # while CI reports success. `[memory]` is installed above, so a
        # fallback here means something is actually wrong.
        #
        # Single line on purpose: a multi-line `python -c "..."` in a YAML
        # block keeps the indentation, and Python reads that as an
        # IndentationError rather than as formatting.
        run: >-
          python -c "import pathlib, tempfile;
          from wukong.storage.db import connect, load_extensions;
          c = connect(pathlib.Path(tempfile.mkdtemp()) / 'x.db');
          a = load_extensions(c);
          print('accelerator:', a);
          assert a == 'sqlite-vec', f'expected sqlite-vec, got {a!r}'"

      - name: Lint
        run: ruff check src tests examples

      - name: Test
        # The suite is fully offline: no API keys, no network. A test suite
        # that needs credentials is a test suite that does not get run.
        run: pytest -q

      - name: Coverage floor
        # A floor, not a target. Without one, coverage only ever goes down:
        # each commit takes a little more of it and nobody notices until a
        # module is at 19% -- which is where cli.py was before this step
        # existed, and where the entire streaming parser of the default
        # provider was (53%, with `_stream` untouched, on the path the
        # console uses).
        #
        # Set below the current number on purpose. A floor that has to be
        # raised by every commit gets lowered instead; one with slack gets
        # left alone.
        run: pytest -q --cov=wukong --cov-report=term:skip-covered --cov-fail-under=75

      - name: Assert no test was silently skipped
        # A skipped test and a passing test look identical in a green run.
        run: |
          set -euo pipefail
          pytest -q -rs | tee /tmp/pytest.out
          if grep -qE "^SKIPPED" /tmp/pytest.out; then
            echo "::error::tests were skipped; see above"
            grep -E "^SKIPPED" /tmp/pytest.out
            exit 1
          fi

      - name: Offline end-to-end smoke
        # Proves the CLI actually works, not just that the units pass.
        run: |
          export WUKONG_HOME="$RUNNER_TEMP/wukong"
          wukong init
          wukong doctor
          wukong demo
          wukong tools | head -20
          wukong sandbox
          wukong desktop --check
          wukong skill validate skills/code-review
          wukong workflow list
          wukong workflow validate triage-and-fix
          wukong workflow list
          wukong workflow validate triage-and-fix

      - name: Service smoke
        # Boot the real server and drive the AG-UI stream over HTTP.
        run: |
          set -euo pipefail
          export WUKONG_HOME="$RUNNER_TEMP/wukong-serve"
          wukong serve --port 8899 &
          SERVER=$!
          for _ in $(seq 1 30); do
            curl -sf --noproxy '*' http://127.0.0.1:8899/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -sf --noproxy '*' http://127.0.0.1:8899/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -s --noproxy '*' -N -X POST http://127.0.0.1:8899/agui \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"list the python files"}],"model":"mock"}' \
            > /tmp/agui.out
          kill $SERVER || true
          grep -q 'RUN_STARTED' /tmp/agui.out
          grep -q 'ACTIVITY_SNAPSHOT' /tmp/agui.out
          grep -q 'RUN_FINISHED' /tmp/agui.out
          # No frame may be a bare JSON scalar -- that is the signature of a
          # handler returning a dict where the caller iterates a list.
          if grep -E '^data: "' /tmp/agui.out; then
            echo "::error::AG-UI emitted a non-object frame"
            exit 1
          fi
          echo "ag-ui stream ok"

  docs:
    name: docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every shipped skill must satisfy the spec it claims to follow
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          for d in skills/*/; do
            echo "validating $d"
            wukong skill validate "$d" || exit 1
          done
