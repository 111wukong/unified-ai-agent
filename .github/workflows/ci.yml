name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint
        run: ruff check src tests examples

      - name: Test
        # The suite is fully offline: no API keys, no network. A test suite
        # that needs credentials is a test suite that does not get run.
        run: pytest -q

      - name: Offline end-to-end smoke
        # Proves the CLI actually works, not just that the units pass.
        run: |
          export UAA_HOME="$RUNNER_TEMP/uaa"
          uaa init
          uaa doctor
          uaa demo
          uaa tools | head -20
          uaa skill validate skills/code-review

  docs:
    name: docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every shipped skill must satisfy the spec it claims to follow
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          for d in skills/*/; do
            echo "validating $d"
            uaa skill validate "$d" || exit 1
          done
