name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # `[api]` and `[memory]` are required here, not optional: without
        # fastapi the API tests `importorskip` and silently vanish, and
        # without sqlite-vec the accelerated cosine path is never exercised.
        # CI going green while a whole layer is untested is the failure the
        # skip guard below exists to catch, but installing the extras is the
        # fix.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,memory]"
          pip install ruff

      - name: Report which vector accelerator is active
        run: python -c "
          from unified_agent.storage.db import connect, load_extensions;
          import tempfile, pathlib;
          c = connect(pathlib.Path(tempfile.mkdtemp())/'x.db');
          print('accelerator:', load_extensions(c))
          "

      - name: Lint
        run: ruff check src tests examples

      - name: Test
        # The suite is fully offline: no API keys, no network. A test suite
        # that needs credentials is a test suite that does not get run.
        run: pytest -q

      - name: Assert no test was silently skipped
        # A skipped test and a passing test look identical in a green run.
        run: |
          set -euo pipefail
          pytest -q -rs | tee /tmp/pytest.out
          if grep -qE "^SKIPPED" /tmp/pytest.out; then
            echo "::error::tests were skipped; see above"
            grep -E "^SKIPPED" /tmp/pytest.out
            exit 1
          fi

      - name: Offline end-to-end smoke
        # Proves the CLI actually works, not just that the units pass.
        run: |
          export UAA_HOME="$RUNNER_TEMP/uaa"
          uaa init
          uaa doctor
          uaa demo
          uaa tools | head -20
          uaa sandbox
          uaa desktop --check
          uaa skill validate skills/code-review

      - name: Service smoke
        # Boot the real server and drive the AG-UI stream over HTTP.
        run: |
          set -euo pipefail
          export UAA_HOME="$RUNNER_TEMP/uaa-serve"
          uaa serve --port 8899 &
          SERVER=$!
          for _ in $(seq 1 30); do
            curl -sf --noproxy '*' http://127.0.0.1:8899/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -sf --noproxy '*' http://127.0.0.1:8899/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -s --noproxy '*' -N -X POST http://127.0.0.1:8899/agui \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"list the python files"}],"model":"mock"}' \
            > /tmp/agui.out
          kill $SERVER || true
          grep -q 'RUN_STARTED' /tmp/agui.out
          grep -q 'ACTIVITY_SNAPSHOT' /tmp/agui.out
          grep -q 'RUN_FINISHED' /tmp/agui.out
          # No frame may be a bare JSON scalar -- that is the signature of a
          # handler returning a dict where the caller iterates a list.
          if grep -E '^data: "' /tmp/agui.out; then
            echo "::error::AG-UI emitted a non-object frame"
            exit 1
          fi
          echo "ag-ui stream ok"

  docs:
    name: docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every shipped skill must satisfy the spec it claims to follow
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          for d in skills/*/; do
            echo "validating $d"
            uaa skill validate "$d" || exit 1
          done
