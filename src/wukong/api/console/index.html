<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wukong 控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <path d="M17.5 14v7M14 17.5h7"/>
        </svg>
      </span>
      <div class="brand-text">
        <span class="brand-name">wukong</span>
        <span class="brand-version" id="version"></span>
      </div>
    </header>

    <section class="panel">
      <h2 class="panel-title">运行</h2>
      <label class="field">
        <span class="field-label">模型</span>
        <input id="model" value="mock" spellcheck="false" autocomplete="off">
      </label>
      <div class="field">
        <span class="field-label">预授权效果</span>
        <div id="approve" class="toggles" role="group" aria-label="预授权效果"></div>
        <p class="hint">已授权的效果不再逐次询问。<code>system_admin</code> 无法在此授权。</p>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">沙箱</h2>
      <div id="sandbox" class="sandbox">
        <span class="skeleton"></span>
      </div>
    </section>

    <section class="panel panel-grow">
      <h2 class="panel-title">
        任务
        <span class="panel-count" id="task-count"></span>
      </h2>
      <div id="tasks" class="task-list"></div>
    </section>

    <footer class="sidebar-footer">
      <a href="/docs" target="_blank" rel="noreferrer">接口文档</a>
      <a href="/api/v1/tools" target="_blank" rel="noreferrer">工具</a>
      <a href="/api/v1/skills" target="_blank" rel="noreferrer">技能</a>
    </footer>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbar-title">控制台</span>
        <span class="chip" id="topbar-status">空闲</span>
      </div>
      <div class="topbar-right" id="topbar-meta"></div>
    </header>

    <div id="transcript">
      <div id="empty" class="empty">
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 17V7a2 2 0 0 1 2-2h9l5 5v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
            <path d="M14 5v5h5"/>
            <path d="M8.5 13.5 11 16l4.5-5"/>
          </svg>
        </div>
        <h2 class="empty-title">让 Agent 做什么？</h2>
        <p class="empty-body">
          它会先规划，然后才开始动手。任何写入、执行命令或联网的操作，都会先停下来问你。
        </p>
        <div class="empty-examples">
          <button type="button" class="example">运行测试，找出失败原因并修复</button>
          <button type="button" class="example">总结这个项目的结构</button>
          <button type="button" class="example">审查最近的改动有没有问题</button>
        </div>
      </div>
    </div>

    <div id="approval" class="approval hidden" role="alertdialog" aria-labelledby="approval-title">
      <div class="approval-head">
        <span class="approval-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 9v4M12 16.5v.01"/>
            <path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
          </svg>
        </span>
        <strong id="approval-title">需要你批准</strong>
        <span id="approval-effect" class="chip chip-warn"></span>
      </div>
      <pre id="approval-preview"></pre>
      <div id="approval-detail" class="approval-detail"></div>
      <div class="approval-actions">
        <button id="btn-approve" class="btn btn-primary">批准</button>
        <button id="btn-deny" class="btn btn-danger">拒绝</button>
      </div>
    </div>

    <form id="composer">
      <div class="composer-box">
        <textarea id="goal" rows="1" placeholder="描述一个任务…" aria-label="任务目标"></textarea>
        <div class="composer-actions">
          <span id="status" class="status" data-state="idle">空闲</span>
          <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
          <button id="btn-cancel" type="button" class="btn btn-ghost" disabled>取消</button>
          <button id="btn-send" type="submit" class="btn btn-primary">发送</button>
        </div>
      </div>
    </form>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
