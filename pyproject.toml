[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wukong"
version = "0.1.0"
description = "Local-first AI agent runtime: durable execution, explicit permissions, context budgeting, skill promotion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
# The desktop window is the OS webview around the same server and console, so
# it needs exactly one dependency. `all` is the "just make it work" extra.
desktop = ["pywebview>=5.0"]
# sqlite-vec accelerates cosine search. It is optional on purpose: the pure
# Python path computes the same metric over the same rows, so a machine
# without it is slower, not different.
memory = ["sqlite-vec>=0.1.6"]
mcp = ["mcp>=1.0"]
all = ["fastapi>=0.115", "uvicorn>=0.32", "pywebview>=5.0", "sqlite-vec>=0.1.6"]

[project.scripts]
wukong = "wukong.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wukong"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's entire API is "call a function in the argument default". B008 is
# not a defect here, it is the framework's documented pattern.
"src/wukong/cli.py" = ["B008"]
"tests/*" = ["B008"]
